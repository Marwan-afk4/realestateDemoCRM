openapi: 3.0.3
info:
  title: CRM API
  version: 1.0.0
  description: |
    Mobile marketplace APIs and authenticated CRM APIs.

    **Admin APIs are not documented here.**

    **Auth:** register or log in to get a Sanctum bearer token. Click **Authorize**
    and paste `Bearer {token}` or just the token.

    - Public auth routes (`/register`, `/login`, OTP, Google) need no token.
    - Device-token routes need any authenticated Sanctum user.
    - `/user/*` marketplace routes need Sanctum **and** `role=user`.
    - `/crm/*` routes need Sanctum plus the matching permission (contacts, pipeline, deals, and so on).
    - Phone OTP routes are limited to **10 or 20 requests per minute** per IP.
  contact:
    name: CRM
servers:
  - url: '{{API_BASE_URL}}'
    description: Application URL from APP_URL
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Register, login, Google Sign-In, password reset, and logout
  - name: Device Tokens
    description: Register or remove FCM device tokens
  - name: Home Names
    description: Public listing names shown on the home screen
  - name: User Homepage
    description: Ads and broker summary for the signed-in user
  - name: User Profile
    description: Profile, update, and delete account
  - name: Developers
    description: Developers and their compounds
  - name: Plans & Payments
    description: Subscription plans, payment methods, and receipts
  - name: Contracts
    description: View, agree, and download contracts
  - name: Bot
    description: Help-bot option tree
  - name: Requests
    description: Training applications and complaints
  - name: User Deals
    description: Broker deal submissions from the mobile app
  - name: Commission
    description: Compound commission percentages
  - name: Leads
    description: Broker leads from the mobile app
  - name: Profit
    description: Broker leads, closed deals, and profit totals
  - name: Favourites
    description: Favourite units and compounds
  - name: Units
    description: Units, buy/rent listings, and unit types
  - name: Sell Requests
    description: User sell-unit applications
  - name: Apartment Installments
    description: Mortgage / installment applications
  - name: Policies
    description: Published policies
  - name: CRM Lookups
    description: Enums and dropdown data for CRM screens
  - name: CRM Notifications
    description: In-app notifications
  - name: CRM Contacts
    description: Contacts, timeline, messaging, and unit matching
  - name: CRM Pipeline
    description: Kanban pipeline tickets
  - name: CRM Tasks
    description: Follow-up tasks and calendar
  - name: CRM Deals
    description: Sales desk — holds, offers, documents, collections, handover
  - name: CRM Inventory
    description: Physical units
  - name: CRM Collections
    description: Buyer installment collections
  - name: CRM Reports
    description: Pipeline and sales KPIs
  - name: CRM Message Templates
    description: WhatsApp / SMS / email templates
  - name: CRM Broadcasts
    description: Outbound broadcasts to contacts
  - name: CRM After Sales
    description: Snagging and customer-care tickets
  - name: CRM Agency
    description: Marketing-agency workspace
  - name: CRM Developer Portal
    description: Developer inventory and authorized brokers
paths:
  /register:
    post:
      tags: [Authentication]
      operationId: register
      summary: Register a user
      description: Sends a WhatsApp OTP unless the phone was already verified. After OTP verification the account is created and a Sanctum token is returned. Optional `fcm_token` / `device_token` and `platform` are stored on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              first_name: Ahmed
              last_name: Hassan
              email: ahmed@example.com
              phone: '01012345678'
              password: secret12
              age: 28
              qualification: Broker
              experience_year: 3
              governce: Cairo
      responses:
        '200':
          description: OTP sent, or user registered when the phone was already verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OtpSentResponse'
                  - $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /register/phone:
    post:
      tags: [Authentication]
      operationId: sendRegisterPhoneOtp
      summary: Send registration WhatsApp OTP
      description: Throttled to 10 requests per minute. Phone may be local (`010…`) or E.164 (`+2010…`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
            example:
              phone: '01012345678'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /register/phone/verify:
    post:
      tags: [Authentication]
      operationId: verifyRegisterPhoneOtp
      summary: Verify registration OTP
      description: Throttled to 20 requests per minute. If registration payload was stored, the user is created and a token is returned.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeRequest'
            example:
              phone: '01012345678'
              code: '483920'
      responses:
        '200':
          description: Phone verified, or user registered
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MessageResponse'
                  - $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /forgot-password:
    post:
      tags: [Authentication]
      operationId: forgotPassword
      summary: Start forgot-password
      description: Stores the new password and sends a WhatsApp OTP. Throttled to 10 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              phone: '01012345678'
              password: newpass1
      responses:
        '200':
          description: OTP sent, or password reset if already verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OtpSentResponse'
                  - $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /forgot-password/verify:
    post:
      tags: [Authentication]
      operationId: verifyForgotPassword
      summary: Confirm forgot-password OTP
      description: Applies the stored password, revokes existing tokens, and returns a new token. Throttled to 20 requests per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeRequest'
            example:
              phone: '01012345678'
              code: '483920'
      responses:
        '200':
          description: Password reset or phone verified
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthTokenResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in
      description: Accepts `email` or `phone` plus `password`. Optional `fcm_token` / `device_token` and `platform` register the device.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: '01012345678'
              password: secret12
              fcm_token: fcm-device-token
              platform: android
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/AuthError'
  /login/google:
    post:
      tags: [Authentication]
      operationId: loginGoogle
      summary: Google Sign-In
      description: Verify a Google ID token from the mobile SDK and issue a Sanctum token. Creates the user if needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
            example:
              id_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '500':
          description: Google auth not configured or verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorBody'
  /user/logout:
    delete:
      tags: [Authentication]
      operationId: logoutUser
      summary: Log out
      description: Deletes the current Sanctum token. Optional `fcm_token` / `device_token` also removes that device. Requires `role=user`.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/device-token:
    post:
      tags: [Device Tokens]
      operationId: storeDeviceToken
      summary: Register FCM token
      description: Any authenticated Sanctum user. Send `token` or `fcm_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
            example:
              token: fcm-device-token
              platform: android
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorBag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Device Tokens]
      operationId: destroyDeviceToken
      summary: Remove FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenDeleteRequest'
            example:
              token: fcm-device-token
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorBag'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/home-names:
    get:
      tags: [Home Names]
      operationId: listHomeNames
      summary: List home names
      description: Public. No authentication required.
      security: []
      responses:
        '200':
          description: Home names
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      type: object
  /user/homepage:
    get:
      tags: [User Homepage]
      operationId: userHomepage
      summary: User homepage
      description: Returns ads. If the user is a broker (`role=brocker` on the model), also returns the broker record. Route middleware still requires `role=user`.
      responses:
        '200':
          description: Homepage payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  ads:
                    type: array
                    items:
                      type: object
                  brocker:
                    nullable: true
                    type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/profile:
    get:
      tags: [User Profile]
      operationId: getUserProfile
      summary: Get profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/delete-profile:
    delete:
      tags: [User Profile]
      operationId: deleteUserProfile
      summary: Delete account
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/update-profile:
    put:
      tags: [User Profile]
      operationId: updateUserProfile
      summary: Update profile
      description: All fields optional. Omitted fields keep their current values. `password` is hashed by the User model.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              first_name: Ahmed
              last_name: Hassan
              governce: Giza
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/developers:
    get:
      tags: [Developers]
      operationId: listUserDevelopers
      summary: List developers
      responses:
        '200':
          description: Developers
          content:
            application/json:
              schema:
                type: object
                properties:
                  developers:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/compounds/{developer_id}:
    get:
      tags: [Developers]
      operationId: listUserCompounds
      summary: List compounds for a developer
      description: Includes units (`uptwons`) and unit images with full storage URLs.
      parameters:
        - name: developer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Compounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  compounds:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/plans-payment-method:
    get:
      tags: [Plans & Payments]
      operationId: listPlansAndPaymentMethods
      summary: List plans and payment methods
      responses:
        '200':
          description: Plans and payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                  payment_methods:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/make-payment:
    post:
      tags: [Plans & Payments]
      operationId: makeUserPayment
      summary: Submit a subscription payment
      description: Creates a pending payment. `receipt` is stored as a string (typically a storage path).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakePaymentRequest'
            example:
              plan_id: 1
              payment_method_id: 1
              receipt: payments/receipt.jpg
      responses:
        '200':
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/MessageValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/contracts:
    get:
      tags: [Contracts]
      operationId: listUserContracts
      summary: List contracts
      responses:
        '200':
          description: Contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  contracts:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/contract/{id}:
    get:
      tags: [Contracts]
      operationId: showUserContract
      summary: Show a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract:
                    type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/contract/{id}/agree:
    post:
      tags: [Contracts]
      operationId: agreeUserContract
      summary: Agree to a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Agreed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Already agreed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/contract/{id}/pdf:
    get:
      tags: [Contracts]
      operationId: downloadUserContractPdf
      summary: Download contract PDF
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/agreed-contracts:
    get:
      tags: [Contracts]
      operationId: listAgreedContracts
      summary: List agreed contracts
      responses:
        '200':
          description: Agreements with nested contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  agreedContracts:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bot/start:
    get:
      tags: [Bot]
      operationId: botStart
      summary: Start bot options
      description: Root-level bot messages (`parent_id` is null).
      responses:
        '200':
          description: Options
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        text:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /bot/select/{id}:
    get:
      tags: [Bot]
      operationId: botSelect
      summary: Select a bot option
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Selected option, bot reply, and next options
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  text:
                    type: string
                  response:
                    nullable: true
                    type: string
                  options:
                    type: array
                    items:
                      type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/send-training-request:
    post:
      tags: [Requests]
      operationId: sendTrainingRequest
      summary: Send a training request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
            example:
              full_name: Ahmed Hassan
              email: ahmed@example.com
              phone: 1012345678
              age: 28
              qualification: Sales
              governate: Cairo
              experience_year: 2
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/MessageValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/send-complaint:
    post:
      tags: [Requests]
      operationId: sendComplaint
      summary: Send a complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintRequest'
            example:
              name: Ahmed
              phone: 1012345678
              message: Need help with my listing
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/MessageValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/send-deal:
    post:
      tags: [User Deals]
      operationId: sendUserDeal
      summary: Submit a deal
      description: Attaches the signed-in user's broker id when a broker record exists. `uptown_id` must belong to `compound_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendDealRequest'
            example:
              fullname: Buyer Name
              nationality_id: '29801011234567'
              phone: '01011112222'
              email: buyer@example.com
              developer_id: 1
              compound_id: 1
              uptown_type_id: 1
              uptown_id: 10
              number_of_units: 1
      responses:
        '200':
          description: Deal created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deal_id:
                    type: integer
        '422':
          $ref: '#/components/responses/MessageValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/get-developer-ids:
    get:
      tags: [User Deals]
      operationId: getDeveloperIds
      summary: Developer id/name list
      responses:
        '200':
          description: Developers
          content:
            application/json:
              schema:
                type: object
                properties:
                  developers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /user/get-compound-ids/{developer_id}:
    get:
      tags: [User Deals]
      operationId: getCompoundIds
      summary: Compound id/name list for a developer
      parameters:
        - name: developer_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Compounds
          content:
            application/json:
              schema:
                type: object
                properties:
                  compounds:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        compound_name:
                          type: string
        '401':
