components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Paste the `token` from login or register.

  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.
    Forbidden:
      description: Wrong role or missing permission
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthorized action.
    AuthError:
      description: Validation or credential error from auth endpoints (often HTTP 401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'
    BadRequest:
      description: Invalid phone or similar
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorBody'
    ValidationError:
      description: Laravel validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LaravelValidationError'
    ValidationErrorBag:
      description: Validation failed with `error` key
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
    MessageValidationError:
      description: Validation failed with `message` key holding the error bag
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: object
    ErrorsBag:
      description: Validation failed with `errors` key
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
    StatusValidationError:
      description: Form-request JSON validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
              errors:
                type: object
    CrmValidationError:
      description: CRM validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

  schemas:
    AuthErrorBody:
      type: object
      properties:
        error:
          description: String or validation object
          oneOf:
            - type: string
            - type: object
        details:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    OtpSentResponse:
      type: object
      properties:
        message:
          type: string
          example: Verification code sent via WhatsApp
        needs_verification:
          type: boolean
          example: true

    AuthTokenResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Sanctum plain-text token

    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          type: string
          example: user
        age:
          type: integer
          nullable: true
        qualification:
          type: string
          nullable: true
        experience_year:
          type: integer
          nullable: true
        governce:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        full_name:
          type: string

    RegisterRequest:
      type: object
      required: [email, phone, password]
      properties:
        first_name:
          type: string
          description: Required unless `full_name` is sent
        last_name:
          type: string
          description: Required unless `full_name` is sent
        full_name:
          type: string
          description: Split into first/last when first_name or last_name is missing
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 6
        age:
          type: integer
          nullable: true
        qualification:
          type: string
          nullable: true
        experience_year:
          type: integer
          nullable: true
        governce:
          type: string
          nullable: true
        fcm_token:
          type: string
        device_token:
          type: string
        platform:
          type: string
          enum: [android, ios, web]

    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    PhoneCodeRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          minLength: 4
          maxLength: 10
          description: Alphanumeric OTP, 4–10 characters

    ForgotPasswordRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [password]
      properties:
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        fcm_token:
          type: string
        device_token:
          type: string
        platform:
          type: string

    GoogleLoginRequest:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
        fcm_token:
          type: string
        device_token:
          type: string
        platform:
          type: string

    DeviceTokenRequest:
      type: object
      properties:
        token:
          type: string
          maxLength: 512
          description: Required unless `fcm_token` is sent
        fcm_token:
          type: string
          maxLength: 512
        platform:
          type: string
          enum: [android, ios, web]
          nullable: true

    DeviceTokenDeleteRequest:
      type: object
      properties:
        token:
          type: string
        fcm_token:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        age:
          type: integer
        governce:
          type: string
        password:
          type: string
        experience_year:
          type: integer
        qualification:
          type: string

    MakePaymentRequest:
      type: object
      required: [plan_id, payment_method_id, receipt]
      properties:
        plan_id:
          type: integer
        payment_method_id:
          type: integer
        receipt:
          type: string

    TrainingRequest:
      type: object
      required: [full_name, email, phone, age]
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: integer
        age:
          type: integer
        qualification:
          type: string
        governate:
          type: string
        experience_year:
          type: integer

    ComplaintRequest:
      type: object
      required: [name, phone, message]
      properties:
        name:
          type: string
        phone:
          type: integer
        message:
          type: string

    SendDealRequest:
      type: object
      required: [fullname, nationality_id, phone, email, developer_id, compound_id, uptown_type_id, number_of_units]
      properties:
        fullname:
          type: string
        nationality_id:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        developer_id:
          type: integer
        compound_id:
          type: integer
        uptown_type_id:
          type: integer
        uptown_id:
          type: integer
          nullable: true
        number_of_units:
          type: integer
          minimum: 1

    AddLeadRequest:
      type: object
      required: [lead_name, lead_phone]
      properties:
        lead_name:
          type: string
        lead_phone:
          type: string
        interested_place:
          type: string
          nullable: true

    FavouriteToggleRequest:
      type: object
      required: [favourite]
      properties:
        favourite:
          type: integer
          minimum: 0
          maximum: 1

    StoreSellRequest:
      type: object
      required:
        - age
        - identity_front_image
        - identity_back_image
        - country
        - city
        - area
        - detailed_pdf
        - price
        - installments
        - uptown_type_id
        - unit_sub_type_id
        - finishing
        - execution_date
      properties:
        age:
          type: integer
          minimum: 18
        identity_front_image:
          type: string
          description: Base64 image
        identity_back_image:
          type: string
          description: Base64 image
        country:
          type: string
        city:
          type: string
        area:
          type: string
        developer_id:
          type: integer
          nullable: true
        compound_id:
          type: integer
          nullable: true
        detailed_pdf:
          type: string
          description: Base64 PDF
        price:
          type: number
          minimum: 0
        installments:
          type: boolean
        installments_years:
          type: integer
          minimum: 1
          description: Required when installments is true
        installments_years_left:
          type: integer
          minimum: 0
        installments_total_price:
          type: number
          minimum: 0
        installments_price_per_year:
          type: number
          minimum: 0
        uptown_type_id:
          type: integer
        unit_sub_type_id:
          type: integer
        rooms_no:
          type: integer
          minimum: 1
        bathrooms_no:
          type: integer
          minimum: 1
        space:
          type: number
          minimum: 1
        floor_no:
          type: integer
        garden_area:
          type: boolean
        garden_space:
          type: number
          minimum: 0
        unit_plan:
          type: string
          description: Base64 image
        video:
          type: string
          format: binary
          description: Multipart video file, max 100MB
        finishing:
          type: string
          enum: [finished, semi_finished, unfinished]
        notes:
          type: string
          nullable: true
        execution_date:
          type: string
          enum: [immediately, 6_months, 1_year, 2_years, 3_years, 4_years_or_more]
        extra_data:
          type: object
          additionalProperties: true
        images:
          type: object
          additionalProperties:
            type: string
          description: Map of key to base64 image

    DeliveryDateRequest:
      type: object
      required: [delivery_date]
      properties:
        delivery_date:
          type: string
          format: date

    StoreInstallmentRequest:
      type: object
      required: [age, identity_front_image, identity_back_image, city, area, job_title, monthly_income, years_of_installment, deposit_percetage]
      properties:
        apartment_id:
          type: integer
          nullable: true
        age:
          type: integer
          minimum: 18
        identity_front_image:
          type: string
        identity_back_image:
          type: string
        city:
          type: string
